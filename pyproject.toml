[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatoire"
dynamic = ["version"]
description = "Observatoire des maladies infectieuses : pipeline d'ingestion OMS Disease Outbreak News"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
observatoire = "observatoire.cli:main"

[tool.setuptools.dynamic]
version = { attr = "observatoire.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.setuptools.package-data]
observatoire = ["py.typed"]
